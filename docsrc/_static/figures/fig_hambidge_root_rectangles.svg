  <text class="geom-label" x="458.00" y="218.00" text-anchor="middle">A</text>
  <text class="geom-label" x="704.52" y="78.00" text-anchor="middle">B</text>
  <text class="geom-label" x="458.00" y="78.00" text-anchor="middle">C</text>
  <text class="geom-label" x="554.52" y="230.00" text-anchor="middle">D</text>
  <text class="geom-note" x="545.61" y="180.30" text-anchor="start">E (90°)</text>
  <text class="geom-note" x="580.00" y="256.00" text-anchor="middle">Reciprocal diagonal CD cuts whole diagonal AB at 90°</text>
</svg>
