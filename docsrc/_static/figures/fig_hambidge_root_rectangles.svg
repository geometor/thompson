  <path class="geom-blue" data-ref="diag_2" d="M 48.00 218.00 L 152.65 144.00 L 257.30 70.00"/>
  <path class="geom-amber" d="M 257.30 70.00 A 256.34 256.34 0 0 1 304.34 218.00"/>
  <text class="geom-label" x="257.30" y="236.00" text-anchor="middle">√2</text>
  <circle class="geom-pt" cx="257.30" cy="218.00" r="2.80"/>
  <path class="geom-line" data-ref="end_root_3" d="M 304.34 218.00 L 304.34 144.00 L 304.34 70.00"/>
  <path class="geom-blue" data-ref="diag_3" d="M 48.00 218.00 L 176.17 144.00 L 304.34 70.00"/>
  <path class="geom-amber" d="M 304.34 70.00 A 296.00 296.00 0 0 1 344.00 218.00"/>
  <text class="geom-label" x="304.34" y="236.00" text-anchor="middle">√3</text>
  <circle class="geom-pt" cx="304.34" cy="218.00" r="2.80"/>
  <path class="geom-line" data-ref="end_root_4" d="M 344.00 218.00 L 344.00 144.00 L 344.00 70.00"/>
  <path class="geom-blue" data-ref="diag_4" d="M 48.00 218.00 L 196.00 144.00 L 344.00 70.00"/>
  <path class="geom-amber" d="M 344.00 70.00 A 330.94 330.94 0 0 1 378.94 218.00"/>
  <text class="geom-label" x="344.00" y="236.00" text-anchor="middle">2 (√4)</text>
  <circle class="geom-pt" cx="344.00" cy="218.00" r="2.80"/>
  <path class="geom-line" data-ref="end_root_5" d="M 378.94 218.00 L 378.94 144.00 L 378.94 70.00"/>
  <text class="geom-label" x="378.94" y="236.00" text-anchor="middle">√5</text>
  <circle class="geom-pt" cx="378.94" cy="218.00" r="2.80"/>
  <text class="geom-label" x="36.00" y="144.00" text-anchor="middle">1</text>
  <text class="geom-note" x="220.00" y="256.00" text-anchor="middle">Incommensurable in length, commensurable in square (Euclid X)</text>
  <path class="geom-fill-soft" d="M 468.00 74.00 L 694.52 74.00 L 694.52 214.00 L 468.00 214.00 Z"/>
  <path class="geom-fill-gold" d="M 468.00 74.00 L 554.52 74.00 L 554.52 214.00 L 468.00 214.00 Z"/>
  <path class="geom-line" d="M 468.00 214.00 L 581.26 214.00 L 694.52 214.00"/>
  <path class="geom-line" d="M 468.00 74.00 L 581.26 74.00 L 694.52 74.00"/>
  <path class="geom-line" d="M 468.00 214.00 L 468.00 144.00 L 468.00 74.00"/>
  <path class="geom-line" d="M 694.52 214.00 L 694.52 144.00 L 694.52 74.00"/>
  <path class="geom-green" data-ref="recip_cut" d="M 554.52 214.00 L 554.52 144.00 L 554.52 74.00"/>
  <path class="geom-blue" data-ref="diag_whole" d="M 468.00 214.00 L 581.26 144.00 L 694.52 74.00"/>
