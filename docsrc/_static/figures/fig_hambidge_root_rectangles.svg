  <path class="geom-fill-gold" d="M 48.00 70.00 L 196.00 70.00 L 196.00 218.00 L 48.00 218.00 Z"/>
  <path class="geom-line" data-ref="base" d="M 48.00 218.00 L 213.47 218.00 L 378.94 218.00"/>
  <path class="geom-line" data-ref="top" d="M 48.00 70.00 L 213.47 70.00 L 378.94 70.00"/>
  <path class="geom-line" data-ref="left_unit" d="M 48.00 218.00 L 48.00 144.00 L 48.00 70.00"/>
  <path class="geom-line" data-ref="end_root_1" d="M 196.00 218.00 L 196.00 144.00 L 196.00 70.00"/>
  <path class="geom-blue" data-ref="diag_1" d="M 48.00 218.00 L 122.00 144.00 L 196.00 70.00"/>
