<svg class="euclid-graphic" viewBox="0 0 740 275" role="img" aria-label="Hambidge root rectangles and orthogonal reciprocal diagonal" xmlns="http://www.w3.org/2000/svg">
  <style>
    .euclid-graphic {
      font-family: Georgia, 'Times New Roman', serif;
      --fg: #18181b;
      --fg-muted: #52525b;
      --grid: #a1a1aa;
      --panel-bg: #fafaf9;
      --accent-blue: #1d4ed8;
      --accent-amber: #b45309;
      --accent-green: #15803d;
      --accent-crimson: #b91c1c;
      --fill-soft: rgba(29, 78, 216, 0.08);
      --fill-gold: rgba(180, 83, 9, 0.11);
      --fill-green: rgba(21, 128, 61, 0.09);
    }
    @media (prefers-color-scheme: dark) {
      .euclid-graphic {
        --fg: #f4f4f5;
        --fg-muted: #a1a1aa;
        --grid: #52525b;
        --panel-bg: #18181b;
        --accent-blue: #60a5fa;
        --accent-amber: #fbbf24;
        --accent-green: #4ade80;
        --accent-crimson: #f87171;
        --fill-soft: rgba(96, 165, 250, 0.13);
        --fill-gold: rgba(251, 191, 36, 0.15);
        --fill-green: rgba(74, 222, 128, 0.13);
      }
    }
    .geom-line {
      stroke: var(--fg);
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-aux {
      stroke: var(--fg-muted);
      stroke-width: 1.1;
      stroke-dasharray: 4 3;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .geom-grid {
      stroke: var(--grid);
      stroke-width: 0.9;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .geom-blue {
      stroke: var(--accent-blue);
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-amber {
      stroke: var(--accent-amber);
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-green {
      stroke: var(--accent-green);
      stroke-width: 1.9;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-crimson {
      stroke: var(--accent-crimson);
      stroke-width: 1.9;
      stroke-dasharray: 5 3;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-fill-soft { fill: var(--fill-soft); stroke: none; }
    .geom-fill-gold { fill: var(--fill-gold); stroke: none; }
    .geom-fill-green { fill: var(--fill-green); stroke: none; }
    .geom-pt { fill: var(--fg); stroke: none; }
    .geom-pt-amber { fill: var(--accent-amber); stroke: none; }
    .geom-pt-blue { fill: var(--accent-blue); stroke: none; }
    .geom-label {
      fill: var(--fg);
      font-size: 13px;
      font-style: italic;
    }
    .geom-note {
      fill: var(--fg-muted);
      font-size: 11.5px;
      font-style: normal;
    }
    .geom-title {
      fill: var(--fg);
      font-size: 13.5px;
      font-weight: bold;
      font-style: normal;
    }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-2 -6 4 12" markerWidth="4" markerHeight="12" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="context-stroke" stroke-width="1.3"/>
    </marker>
    <marker id="geom-tick-2" viewBox="-4 -6 8 12" markerWidth="8" markerHeight="12" orient="auto">
      <line x1="-2" y1="-4.5" x2="-2" y2="4.5" stroke="context-stroke" stroke-width="1.3"/>
      <line x1="2" y1="-4.5" x2="2" y2="4.5" stroke="context-stroke" stroke-width="1.3"/>
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" markerWidth="12" markerHeight="12" orient="auto">
      <line x1="-3.5" y1="-4.5" x2="-3.5" y2="4.5" stroke="context-stroke" stroke-width="1.3"/>
      <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="context-stroke" stroke-width="1.3"/>
      <line x1="3.5" y1="-4.5" x2="3.5" y2="4.5" stroke="context-stroke" stroke-width="1.3"/>
    </marker>
  </defs>
  <text class="geom-title" x="220.00" y="26.00" text-anchor="middle">A. Root-Rectangle Unfolding (Q = 1, 2, 3, 4, 5)</text>
  <text class="geom-title" x="580.00" y="26.00" text-anchor="middle">B. Orthogonal Diagonal of the Reciprocal</text>
