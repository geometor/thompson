        --fill-gold: rgba(251, 191, 36, 0.15);
        --fill-green: rgba(74, 222, 128, 0.13);
      }
    }
    .geom-line {
      stroke: var(--fg);
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-aux {
      stroke: var(--fg-muted);
      stroke-width: 1.1;
      stroke-dasharray: 4 3;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .geom-grid {
      stroke: var(--grid);
      stroke-width: 0.9;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .geom-blue {
      stroke: var(--accent-blue);
      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-amber {
      stroke: var(--accent-amber);
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-green {
      stroke: var(--accent-green);
      stroke-width: 1.9;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-crimson {
      stroke: var(--accent-crimson);
      stroke-width: 1.9;
      stroke-dasharray: 5 3;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-fill-soft { fill: var(--fill-soft); stroke: none; }
    .geom-fill-gold { fill: var(--fill-gold); stroke: none; }
    .geom-fill-green { fill: var(--fill-green); stroke: none; }
    .geom-pt { fill: var(--fg); stroke: none; }
    .geom-pt-amber { fill: var(--accent-amber); stroke: none; }
    .geom-pt-blue { fill: var(--accent-blue); stroke: none; }
    .geom-label {
      fill: var(--fg);
      font-size: 13px;
      font-style: italic;
    }
    .geom-note {
      fill: var(--fg-muted);
      font-size: 11.5px;
      font-style: normal;
    }
    .geom-title {
      fill: var(--fg);
      font-size: 13.5px;
      font-weight: bold;
      font-style: normal;
    }
  </style>
