  <style>
    .euclid-graphic {
      font-family: Georgia, 'Times New Roman', serif;
      --fg: #18181b;
      --fg-muted: #52525b;
      --grid: #a1a1aa;
      --panel-bg: #fafaf9;
      --accent-blue: #1d4ed8;
      --accent-amber: #b45309;
      --accent-green: #15803d;
      --accent-crimson: #b91c1c;
      --fill-soft: rgba(29, 78, 216, 0.08);
      --fill-gold: rgba(180, 83, 9, 0.11);
      --fill-green: rgba(21, 128, 61, 0.09);
    }
    @media (prefers-color-scheme: dark) {
      .euclid-graphic {
        --fg: #f4f4f5;
        --fg-muted: #a1a1aa;
        --grid: #52525b;
        --panel-bg: #18181b;
        --accent-blue: #60a5fa;
        --accent-amber: #fbbf24;
