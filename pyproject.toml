[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometor-thompson"
authors = [{name = "phi ARCHITECT", email = "phi@geometor.com"}]
description = "Scholarly Book Codex for D'Arcy Wentworth Thompson's On Growth and Form (Cambridge 1st Ed., 1917) with a Dynamic Symmetry & Gnomonic Morphology Concordance to Jay Hambidge (1920)."
readme = "README.rst"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
geometor-thompson = "geometor.thompson.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.thompson.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/thompson"
"Repository" = "https://github.com/geometor/thompson"
"Issues" = "https://github.com/geometor/thompson/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
