    .geom-pt-blue { fill: var(--accent-blue); stroke: none; }
    .geom-label {
      fill: var(--fg);
      font-size: 13px;
      font-style: italic;
    }
    .geom-note {
      fill: var(--fg-muted);
      font-size: 11.5px;
      font-style: normal;
    }
    .geom-title {
