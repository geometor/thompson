      stroke-width: 2.0;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-amber {
      stroke: var(--accent-amber);
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .geom-green {
