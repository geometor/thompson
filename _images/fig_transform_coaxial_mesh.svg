    .geom-pt-amber { fill: var(--accent-amber); stroke: none; }
    .geom-pt-blue { fill: var(--accent-blue); stroke: none; }
    .geom-label {
      fill: var(--fg);
      font-size: 13px;
      font-style: italic;
    }
    .geom-note {
      fill: var(--fg-muted);
      font-size: 11.5px;
      font-style: normal;
    }
    .geom-title {
      fill: var(--fg);
      font-size: 13.5px;
      font-weight: bold;
